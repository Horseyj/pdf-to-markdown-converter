[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2md"
version = "0.1.1"
description = "Convert PDFs to clean markdown using docling. Single command, batch and single-PDF modes, self-contained per-PDF output."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "James H" }]
keywords = ["pdf", "markdown", "docling", "ocr", "document-conversion"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "docling>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
pdf2md = "pdf2md.cli:main"

[project.urls]
Homepage = "https://github.com/Horseyj/pdf-to-markdown-converter"
Repository = "https://github.com/Horseyj/pdf-to-markdown-converter"
Issues = "https://github.com/Horseyj/pdf-to-markdown-converter/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
